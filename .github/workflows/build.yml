name: Build MRPORT

on:
  push:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download WinDivert
      shell: pwsh
      run: |
        $version = "2.2.0"
        $url = "https://github.com/basil00/WinDivert/releases/download/v$version/WinDivert-$version-x64.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\windivert.zip"
        Expand-Archive -Path "$env:TEMP\windivert.zip" -DestinationPath "$env:TEMP\windivert-extract" -Force
        New-Item -ItemType Directory -Force -Path WinDivert
        Copy-Item "$env:TEMP\windivert-extract\x64\WinDivert64.sys" -Destination WinDivert/
        Copy-Item "$env:TEMP\windivert-extract\x64\WinDivert.dll" -Destination WinDivert/

    - name: Build
      shell: pwsh
      run: |
        dotnet publish MRPORT.csproj -c Release -o out `
          --runtime win-x64 `
          --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MRPORT-x64
        path: out/
